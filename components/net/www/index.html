<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 设备配置</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --fg:#18181b; --muted:#6b7280;
    --line:#e4e4e7; --soft:#f4f4f5; --accent:#0f766e; --accent-fg:#fff;
    --ring:rgba(15,118,110,.20);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0c0e; --card:#141518; --fg:#f4f4f5; --muted:#9ca3af;
           --line:#26272b; --soft:#1b1c20; --accent:#2dd4bf; --accent-fg:#06231f;
           --ring:rgba(45,212,191,.25); }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100dvh; padding:24px 16px;
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:440px; margin:0 auto}
  .brand{margin:0 0 6px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  h1{margin:0 0 4px; font-size:22px; letter-spacing:-.01em}
  .sub{margin:0 0 20px; font-size:14px; color:var(--muted)}
  section{margin:0 0 18px}
  h2{margin:0 0 10px; font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.02em}
  .row-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .row-head h2{margin:0}
  label{display:block; margin:0 0 6px; font-size:13px; font-weight:600}
  .field{margin-bottom:14px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  input{
    width:100%; padding:11px 13px; font-size:16px; color:var(--fg);
    background:transparent; border:1px solid var(--line); border-radius:10px;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)}
  .pw{position:relative}
  .pw input{padding-right:44px}
  .eye{
    position:absolute; top:50%; right:7px; transform:translateY(-50%);
    display:grid; place-items:center; width:30px; height:30px;
    color:var(--muted); background:none; border:0; border-radius:8px;
  }
  .eye:hover{color:var(--fg); background:var(--soft)}
  .eye .slash{opacity:0}
  .eye.off .slash{opacity:1}
  .trow{display:grid; grid-template-columns:1fr 36px; gap:8px; margin-bottom:8px; align-items:center}
  button{font-family:inherit; cursor:pointer}
  .ghost{
    padding:8px 10px; font-size:13px; font-weight:600; color:var(--accent);
    background:transparent; border:1px solid var(--line); border-radius:9px;
  }
  .ghost:hover{background:var(--soft)}
  .del{padding:8px 0; color:var(--muted); font-size:16px}
  .primary{
    width:100%; margin-top:8px; padding:13px 16px; font-size:15px; font-weight:600;
    color:var(--accent-fg); background:var(--accent); border:0; border-radius:10px;
    transition:filter .15s;
  }
  .primary:hover{filter:brightness(1.05)}
  .primary:active{filter:brightness(.95)}
  .msg{margin:12px 0 0; font-size:13px; color:var(--muted); min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">ESP32</p>
  <h1>设备配置</h1>
  <p class="sub">Wi-Fi 与 MQTT 参数，保存后生效。</p>

  <form id="f">
    <section>
      <h2>Wi-Fi</h2>
      <div class="field"><label for="ssid">网络名称</label><input id="ssid" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field">
        <label for="wpass">密码</label>
        <div class="pw">
          <input id="wpass" type="password" autocomplete="off">
          <button type="button" class="eye" onclick="togglePw('wpass', this)" aria-label="显示/隐藏密码">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="2.6"/>
              <line class="slash" x1="4" y1="20" x2="20" y2="4"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <section>
      <h2>MQTT Broker</h2>
      <div class="grid2">
        <div class="field"><label for="host">地址</label><input id="host" value="mqtt.example.com"></div>
        <div class="field"><label for="port">端口</label><input id="port" type="number" value="1883"></div>
      </div>
      <div class="field"><label for="cid">Client ID</label><input id="cid" value="esp32-node"></div>
      <div class="grid2">
        <div class="field"><label for="muser">用户名</label><input id="muser" autocomplete="off"></div>
        <div class="field">
          <label for="mpass">密码</label>
          <div class="pw">
            <input id="mpass" type="password" autocomplete="off">
            <button type="button" class="eye" onclick="togglePw('mpass', this)" aria-label="显示/隐藏密码">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="2.6"/>
                <line class="slash" x1="4" y1="20" x2="20" y2="4"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="row-head"><h2>发布主题 · Publish</h2><button type="button" class="ghost" onclick="addRow('pub')">+ 添加</button></div>
      <div id="pub"></div>
    </section>

    <section>
      <div class="row-head"><h2>订阅主题 · Subscribe</h2><button type="button" class="ghost" onclick="addRow('sub')">+ 添加</button></div>
      <div id="sub"></div>
    </section>

    <button type="submit" class="primary">保存</button>
    <p id="msg" class="msg"></p>
  </form>
</div>

<template id="rowTpl">
  <div class="trow">
    <input class="t-topic" placeholder="主题，如 home/room1/device1/cmd" autocomplete="off" spellcheck="false">
    <button type="button" class="ghost del" title="删除">×</button>
  </div>
</template>

<script>
function togglePw(id, btn){
  var el = document.getElementById(id);
  if (el.type === 'password'){      // 隐藏 → 显示
    el.type = 'text';
    btn.classList.add('off');       // 眼睛加斜线
  } else {                          // 显示 → 隐藏
    el.type = 'password';
    btn.classList.remove('off');
  }
}
function addRow(kind, topic){
  var box = document.getElementById(kind);
  var node = document.getElementById('rowTpl').content.cloneNode(true);
  if (topic) node.querySelector('.t-topic').value = topic;
  node.querySelector('.del').onclick = function(e){ e.target.closest('.trow').remove(); };
  box.appendChild(node);
}
function collect(kind){
  var rows = document.querySelectorAll('#' + kind + ' .trow');
  var out = [];
  for (var i = 0; i < rows.length; i++){
    var t = rows[i].querySelector('.t-topic').value.trim();
    if (t) out.push(t);
  }
  return out;
}
function v(id){ return document.getElementById(id).value; }

document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var cfg = {
    wifi: { ssid: v('ssid'), pass: v('wpass') },
    mqtt: { host: v('host'), port: +v('port'), client_id: v('cid'),
            username: v('muser'), password: v('mpass') },
    publish:   collect('pub'),
    subscribe: collect('sub')
  };
  var msg = document.getElementById('msg');
  msg.textContent = '保存中…';
  try{
    var r = await fetch('/', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cfg) });
    var t = await r.text();
    msg.textContent = r.ok ? (t === 'unchanged' ? '没有变化' : '已保存') : ('失败 ' + r.status);
  }catch(err){ msg.textContent = '请求失败'; }
});

async function load(){
  var c = window.__CFG__ || {};
  if(!window.__CFG__){
    try{ var r = await fetch('/config'); if(r.ok) c = await r.json(); }catch(e){}
  }
  if(c.wifi){
    document.getElementById('ssid').value = c.wifi.ssid || '';
    document.getElementById('wpass').value = c.wifi.pass || '';
  }
  if(c.mqtt){
    var m = c.mqtt;
    var set = function(id, v){ if(v != null) document.getElementById(id).value = v; };
    set('host', m.host); set('port', m.port); set('cid', m.client_id);
    set('muser', m.username); set('mpass', m.password);
  }
  var pub = (c.publish || []), sub = (c.subscribe || []);
  if(!pub.length) pub = ['home/room1/device1/data'];
  if(!sub.length) sub = ['home/room1/device1/cmd'];
  document.getElementById('pub').innerHTML = '';
  document.getElementById('sub').innerHTML = '';
  pub.forEach(function(t){ addRow('pub', t); });
  sub.forEach(function(t){ addRow('sub', t); });
}
load();
</script>
</body>
</html>
